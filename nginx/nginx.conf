user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 100k;
  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format main '$remote_addr - $request_id [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" upstream=$upstream_addr rt=$request_time';
  access_log /var/log/nginx/access.log main;

  map $http_x_request_id $request_id_value {
    default $http_x_request_id;
    "" $request_id;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /nginx-health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok","service":"nginx"}';
    }

    location ~ ^/(api|public)(/|$) {
      set $backend http://backend:3000;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id_value;
      proxy_connect_timeout 3s;
      proxy_read_timeout 40s;
      proxy_send_timeout 40s;
    }

    location = /health {
      set $backend http://backend:3000;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
    }

    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
