name: cinemaseat

services:
  nginx:
    build:
      context: ..
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: /api
    image: cinemaseat-nginx:${IMAGE_TAG:-local}
    ports:
      - "${NGINX_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cinemaseat-backend:${IMAGE_TAG:-local}
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cinemaseat}:${POSTGRES_PASSWORD:-cinemaseat}@db:5432/${POSTGRES_DB:-cinemaseat}
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-access-secret-change-before-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development-refresh-secret-change-before-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-your_cloud_name}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-your_api_key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-your_api_secret}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-300}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      HOLD_SWEEP_INTERVAL_MS: ${HOLD_SWEEP_INTERVAL_MS:-5000}
      GATEWAY_URL: http://gateway:9000
      # Gateway callbacks enter through the same reverse proxy used by clients.
      PUBLIC_API_URL: http://nginx:8080
      GATEWAY_SECRET: ${GATEWAY_SECRET:-z2p-2026-secret}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:${PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:$${PORT}/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend-network

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinemaseat}
      POSTGRES_USER: ${POSTGRES_USER:-cinemaseat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinemaseat}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cinemaseat-backend:${IMAGE_TAG:-local}
    command: ["sh", "-c", "npm run db:migrate && node worker.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cinemaseat}:${POSTGRES_PASSWORD:-cinemaseat}@db:5432/${POSTGRES_DB:-cinemaseat}
      REDIS_URL: redis://redis:6379
      HOLD_SWEEP_INTERVAL_MS: ${HOLD_SWEEP_INTERVAL_MS:-5000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    networks:
      - backend-network

  gateway:
    image: asifmahmoud414/mock-gateway:latest
    ports: ["127.0.0.1:${GATEWAY_PORT:-9000}:9000"]
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:-z2p-2026-secret}
    restart: unless-stopped
    networks:
      - backend-network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-network

volumes:
  postgres-data:
  redis-data:

networks:
  backend-network:
    driver: bridge
