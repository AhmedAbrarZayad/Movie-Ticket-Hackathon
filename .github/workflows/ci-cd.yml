name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------- JOB 0: THE TRAFFIC COP ----------
  # Looks at which folders changed in this push/PR
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Check which folders changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/**'
            backend:
              - 'backend/**'
              - '.github/**'

  # ---------- JOB 1: FRONTEND CI ----------
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'   # only run if frontend changed
    defaults:
      run:
        working-directory: frontend                # <-- "cd frontend" before every command
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json  # <-- where the lock file lives

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

  # ---------- JOB 2: BACKEND CI ----------
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'    # only run if backend changed
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cinemaseat_test
          POSTGRES_USER: cinemaseat
          POSTGRES_PASSWORD: cinemaseat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cinemaseat -d cinemaseat_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://cinemaseat:cinemaseat@localhost:5432/cinemaseat_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-thirty-two-characters
    defaults:
      run:
        working-directory: backend                 # <-- "cd backend" before every command
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test --if-present

      - name: Apply database migrations
        run: npm run db:migrate

      - name: PostgreSQL and Redis integration tests
        run: npm run test:integration
        env:
          RUN_INTEGRATION_TESTS: 'true'

      - name: Build
        run: npm run build --if-present

      - name: Build Docker image
        run: docker build --tag cinemaseat-backend:${{ github.sha }} .

      - name: Validate Docker Compose
        run: docker compose config --quiet

  # ---------- JOB 3: THE SINGLE GREEN LIGHT ----------
  # This is the ONLY job your branch protection will require.
  # It passes even if frontend/backend jobs were skipped (e.g. docs-only change).
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [changes, frontend-ci, backend-ci]
    if: always()
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: All good
        run: echo "✅ All required checks passed or were skipped."

  # ---------- JOB 4: DEPLOYMENT (CD) ----------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [changes, ci-success]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # main pushes only
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Deploy frontend
        if: needs.changes.outputs.frontend == 'true'
        run: |
          echo "🚀 Deploying frontend..."
          # Later, replace with your real command, e.g.:
          # npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy backend
        if: needs.changes.outputs.backend == 'true'
        run: |
          echo "🚀 Deploying backend..."
          # Later, replace with your real backend deploy command

      - name: Nothing to deploy
        if: needs.changes.outputs.frontend != 'true' && needs.changes.outputs.backend != 'true'
        run: echo "No deployable application changes detected."
